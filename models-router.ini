version = 1

; router model presets for Pi (llama.cpp provider)
; model IDs = section names, shown in Pi /model and /llama
;
; ${HF_CACHE} is the Hugging Face hub directory. llama.cpp does not expand it, so
; start_server.sh renders this into a resolved copy (HF_CACHE defaults to
; ~/.cache/huggingface/hub) and passes that to --models-preset.

[*]
ngl = 99
split-mode = none
flash-attn = on
; turbo4 KV cache: uses the merged fused-MMA decode path (+30% tg at 16k depth
; vs the old VEC path on RTX 5090). Change to q8_0 or f16 if quality matters more.
ctk = turbo4
ctv = turbo4
batch-size = 2048
ubatch-size = 512
no-mmap = true
mlock = true
parallel = 1
jinja = true
no-warmup = true
reasoning-preserve = true

; secondary: highest-quality quant, turbo4 KV keeps it in VRAM (q8_0 at 200k OOMs)
[qwen3.8-27b-q6]
model = ${HF_CACHE}/models--unsloth--Qwen3.8-27B-GGUF/snapshots/4ca720788d1e01f1bff70c033e0d0028fd02e502/Qwen3.8-27B-UD-Q6_K_M.gguf
spec-type = draft-mtp
spec-draft-model = ${HF_CACHE}/models--unsloth--Qwen3.8-27B-GGUF/snapshots/4ca720788d1e01f1bff70c033e0d0028fd02e502/MTP/mtp-Qwen3.8-27B-Q4_0.gguf
spec-draft-n-max = 2
ctx-size = 153600

; R9700 (ROCm0) model, card also drives the monitors (~3 GB VRAM for the desktop).
; Load-tested at 153600 + q8_0 KV: 25.8/32.6 GB VRAM, ~26 t/s decode.
; 262144 also fits (29.9 GB) but leaves no headroom for the desktop.
[swift-qwen3.8-27b-q4]
load-on-startup = true
model = ${HF_CACHE}/models--ukisai--Swift-Qwen3.8-27B-GGUF/snapshots/98a6100719e3aafa186041089b71c7b48390dbe1/Swift-Qwen3.8-27B-Q4_K_M.gguf
dev = ROCm0
ctx-size = 153600
ctk = q8_0
ctv = q8_0

[qwen3.8-27b-turbo-iq4xs]
model = ${HF_CACHE}/models--DavidAU--Qwen3.8-27B-TURBO-Fable-Cold-Fusion-735-882-Heretic-Uncensored-NEO-CODER-MAX-MTP-GGUF/snapshots/b9bce7e859c9b5047aca884e5bff76f8a0443de1/Qwen3.8-27B-TurboFCFusion-735-882-Here-Uncen-NEO-CODER-MAX-IQ4_XS.gguf
dev = ROCm0
ctx-size = 262144
ctk = q8_0
ctv = q8_0

; 256k context, q8_0 KV, embedded MTP draft (65th layer), on ROCm0 (the R9700).
; Not pinned at startup: [swift-qwen3.8-27b-q4] already holds that card and switching
; to this one evicts it. Load-tested alone on the 5090: 28.6/32.6 GB used, which is
; tight for the R9700 once the desktop takes its ~2.4 GB - drop ctx-size to 153600 if
; it fails to load. 262144 is the model's native max; going higher needs YaRN rope
; scaling (not recommended).
[qwen3.8-27b-turbo-lowmtp-iq4xs]
load-on-startup = false
model = ${HF_CACHE}/models--DavidAU--Qwen3.8-27B-TURBO-Fable-Cold-Fusion-735-882-Heretic-Uncensored-NEO-CODER-MAX-MTP-GGUF/snapshots/b9bce7e859c9b5047aca884e5bff76f8a0443de1/Qwen3.8-27B-TurboFCFusion-735-882-Here-Uncen-NEO-CODER-MAX-LOW-MTP-IQ4_XS.gguf
dev = ROCm0
spec-type = draft-mtp
spec-draft-n-max = 2
ctx-size = 262144
ctk = q8_0
ctv = q8_0

[qwen3.8-27b-turbo-lowmtp-q6k]
; Q6_K weights (22.6 GB) + 131k turbo4 KV fits; q8_0 at this size does not
model = ${HF_CACHE}/models--DavidAU--Qwen3.8-27B-TURBO-Fable-Cold-Fusion-735-882-Heretic-Uncensored-NEO-CODER-MAX-MTP-GGUF/snapshots/b9bce7e859c9b5047aca884e5bff76f8a0443de1/Qwen3.8-27B-TurboFCFusion-735-882-Here-Uncen-NEO-CODER-MAX-LOW-MTP-Q6_K.gguf
spec-type = draft-mtp
spec-draft-n-max = 2
ctx-size = 153600

[qwen3.8-27b-turbofcfusion-735-882-here-uncen-neo-coder-max-iq2_m]
model = ${HF_CACHE}/models--DavidAU--Qwen3.8-27B-TURBO-Fable-Cold-Fusion-735-882-Heretic-Uncensored-NEO-CODER-MAX-MTP-GGUF/snapshots/b9bce7e859c9b5047aca884e5bff76f8a0443de1/Qwen3.8-27B-TurboFCFusion-735-882-Here-Uncen-NEO-CODER-MAX-IQ2_M.gguf
ctx-size = 262144

[qwen3.8-27b-turbofcfusion-735-882-here-uncen-neo-coder-max-iq3_m]
model = ${HF_CACHE}/models--DavidAU--Qwen3.8-27B-TURBO-Fable-Cold-Fusion-735-882-Heretic-Uncensored-NEO-CODER-MAX-MTP-GGUF/snapshots/b9bce7e859c9b5047aca884e5bff76f8a0443de1/Qwen3.8-27B-TurboFCFusion-735-882-Here-Uncen-NEO-CODER-MAX-IQ3_M.gguf
ctx-size = 262144

[swift-qwen3.8-27b-q6_k]
model = ${HF_CACHE}/models--ukisai--Swift-Qwen3.8-27B-GGUF/snapshots/98a6100719e3aafa186041089b71c7b48390dbe1/Swift-Qwen3.8-27B-Q6_K.gguf
ctx-size = 262144

; qwen4exp (hybrid SSM + sparse MoE). Too big for VRAM, so instead of dropping
; whole layers (ngl) keep ngl = 99 and send only the expert FFNs to RAM: they are
; sparsely activated, attention/SSM/KV/shared experts stay on the GPU.
; Load-tested: 29.2/32.6 GB VRAM with desktop on the 5090, ~21 t/s decode,
; 22.4 GB of weights in RAM. Move blk.20 -> blk.16 for more VRAM headroom.
; No MTP layer in this file, so no spec decoding.
; Shares CUDA0 with the 113B: only one of the two can be up at a time.
[qwen3.8-flash-coder-43gb-q8]
model = ${HF_CACHE}/models--Jab1718--qwen3.8-flash-coder-26gb-gguf/snapshots/4d62a522f3c70b6e9579015602129a15fe161804/qwen3.8-flash-coder-43gb-q8_0.gguf
dev = CUDA0
ctx-size = 262144
ctk = q8_0
ctv = q8_0
ot = blk\.19\.ffn_(gate|up|gate_up|down).*=CPU,blk\.(20|2[1-9]|3[0-9]|4[0-8])\.ffn_(up|down|gate_up|gate)_(ch|)exps=CPU

; 4-shard qwen4exp, 113 GB total: experts from blk.10 to RAM, ~95 GB in RAM.
; Load-tested on the 5090 (CUDA0) at 262144 + q8_0 KV: 26.3/32.6 GB VRAM,
; 169 t/s pp, ~25 t/s tg at 8k depth. mmap stays on so the page cache holds the
; experts (mlock would need a memlock limit the box does not have).
; Do not enable spec-type = draft-mtp here: the embedded MTP layer aborts in
; ggml-cuda/binbcast.cu (nb10 assert) with these expert-on-CPU overrides.
[qwen3.8-flash-next-113b-q4km]
load-on-startup = true
model = ${HF_CACHE}/models--him0413--Qwen3.8-Flash-Next-Uncensored-Q4_K_M-MTP/snapshots/54fc5130b3f6b4555ba9d70a27fd74803b7b1ca3/Qwen3.8-Flash-Next-Uncensored-Q4_K_M-MTP-00001-of-00004.gguf
dev = CUDA0
ctx-size = 262144
ctk = q8_0
ctv = q8_0
no-mmap = false
mlock = false
ot = blk\.(10|1[1-9]|2[0-9]|3[0-9]|4[0-8])\.ffn_(up|down|gate_up|gate)_(ch|)exps=CPU

; Same him0413 file at 1M context. 262144 is the trained max, the model card extends it with
; static YaRN: factor 4 = rope-scale 4 over yarn-orig-ctx 262144. The factor also applies to
; short prompts, so keep the 262144 section above for normal work.
; q8_0 KV is 17.6 GiB at this size, so experts go to RAM from blk.2, not blk.10.
; Dry-run estimate (llama-fit-params, not load-tested): 28.5 GiB on the 5090, 106 GiB in RAM.
; The 262144 section measures ~1 GiB over its estimate. If this one OOMs, move blk.2 -> blk.0 (-3.4 GiB).
; Shares CUDA0 with the other Flash Next sections: only one can be up at a time.
[qwen3.8-flash-next-113b-q4km-1m]
load-on-startup = false
model = ${HF_CACHE}/models--him0413--Qwen3.8-Flash-Next-Uncensored-Q4_K_M-MTP/snapshots/54fc5130b3f6b4555ba9d70a27fd74803b7b1ca3/Qwen3.8-Flash-Next-Uncensored-Q4_K_M-MTP-00001-of-00004.gguf
dev = CUDA0
ctx-size = 1048576
rope-scaling = yarn
rope-scale = 4
yarn-orig-ctx = 262144
ctk = q8_0
ctv = q8_0
no-mmap = false
mlock = false
ot = blk\.([2-9]|[1-4][0-9])\.ffn_(up|down|gate_up|gate)_(ch|)exps=CPU

; vmlinux re-quant of the same qwen4exp base: single file, 102.2 GiB, 48 blocks
; (blk.0..47), 512 experts. Unlike the him0413 file above it ships a projector
; (mmproj-BF16, 0.9 GB), so it can read images. No nextn tensors, so no MTP draft.
; Experts blk.10..47 to RAM, same scheme as the 113B, so it needs the whole 5090:
; it only loads once [qwen3.8-flash-next-113b-q4km] has gone idle. The router frees a
; models_max slot on whichever model went idle first, not necessarily one on the card
; you need - that is what OOMed qwen3.8-flash-coder-43gb-q8. If this one fails the
; same way, unload the 113B by hand first.
; Models whose experts sit in RAM are bound by CPU expert compute + DRAM bandwidth, not by
; page-cache faults: load-mode = none + no-op-offload + turbo4 KV measured 100 t/s pp and
; 20.4 t/s tg warm, against the 115 pp / 37 tg of the mmap + q8_0 KV settings below. The
; server warning about CPU tensor overrides under mmap is a red herring on this rig.
[qwen3.8-flash-next-gufo-q4mix-vision]
model = ${HF_CACHE}/models--vmlinux--Qwen3.8-Flash-Next-Uncensored-Gufo-Q4Mix-GGUF/snapshots/0a0843cce72b4d8c377096960b3f0f9c0f4d197f/Qwen3.8-Flash-Next-Uncensored-Gufo-Q4Mix.gguf
mmproj = ${HF_CACHE}/models--vmlinux--Qwen3.8-Flash-Next-Uncensored-Gufo-Q4Mix-GGUF/snapshots/0a0843cce72b4d8c377096960b3f0f9c0f4d197f/mmproj-BF16.gguf
dev = CUDA0
ctx-size = 262144
ctk = q8_0
ctv = q8_0
no-mmap = false
mlock = false
ot = blk\.(10|1[1-9]|2[0-9]|3[0-9]|4[0-7])\.ffn_(up|down|gate_up|gate)_(ch|)exps=CPU

; Same Gufo file at 1M context, static YaRN as in [qwen3.8-flash-next-113b-q4km-1m]. Keep the
; 262144 section above for normal work.
; The blk.2 split of the him0413 1M section does not fit here: 7.4 GiB weights + 17.6 GiB KV +
; 6.7 GiB compute = 31.7 GiB estimate on a 31.4 GiB card, cudaMalloc fails on the compute buffer. So every expert
; block goes to RAM (-2.9 GiB), 98 GiB in page cache.
; Load-tested alone on the 5090: 30.2/32.6 GB VRAM, 13.4 t/s tg and 2.8 t/s pp on the first
; (cold) request, 17.9 t/s tg on the second. Not measured warm or at depth.
; Vision tower on the R9700: CUDA0 has no room for it at this size. Image input tested.
; Shares CUDA0 with the other Flash Next sections: only one can be up at a time.
[qwen3.8-flash-next-gufo-q4mix-vision-1m]
load-on-startup = false
model = ${HF_CACHE}/models--vmlinux--Qwen3.8-Flash-Next-Uncensored-Gufo-Q4Mix-GGUF/snapshots/0a0843cce72b4d8c377096960b3f0f9c0f4d197f/Qwen3.8-Flash-Next-Uncensored-Gufo-Q4Mix.gguf
mmproj = ${HF_CACHE}/models--vmlinux--Qwen3.8-Flash-Next-Uncensored-Gufo-Q4Mix-GGUF/snapshots/0a0843cce72b4d8c377096960b3f0f9c0f4d197f/mmproj-BF16.gguf
mmproj-device = ROCm0
dev = CUDA0
ctx-size = 1048576
rope-scaling = yarn
rope-scale = 4
yarn-orig-ctx = 262144
ctk = q8_0
ctv = q8_0
no-mmap = false
mlock = false
ot = blk\.[0-9]+\.ffn_(up|down|gate_up|gate)_(ch|)exps=CPU

; unsloth qwen4exp, 103.7 GiB, 48 blocks (blk.0..47). Same scheme as the 113B: experts from blk.10 to RAM.
; Without -ot, 78 GB of weights go to the GPU and cudaMalloc fails.
; ~20 GiB weights on the 5090, 31.2/32.6 GB VRAM with 262144 + q8_0 KV.
; Measured warm through the router: 115 t/s pp at 99k depth (so Pi's 99k prompts cost 14 min of
; prefill), 37-39 t/s tg short context, 19.3 t/s tg at 99k depth. MTP works here, 100% draft
; acceptance on short easy turns. The first request after a load is cold and roughly half that.
; No nextn tensors in this file, so the draft comes from unsloth's MTP/ folder. The shared
; module ships no embed_tokens/lm_head - it borrows the target's, so it only loads as a draft
; of this model, never standalone. Expect "borrow_shared_tensor: ... not on its own" in the log
; on every load: the memory-fit pass tries the draft standalone, fails, and the real load goes
; through anyway. n-max 2 not 5: every draft slot routes 10 more experts per layer through RAM,
; and the offloaded-rig measurements stop paying past dn=2.
; Do not switch this to load-mode = none / no-op-offload / turbo4 KV: 20.4 t/s tg against the
; 37-39 above with the same prompt. mmap + q8_0 KV is the faster combination on this rig.
; Vision: unsloth ships the tower once at the repo root for every quant of this base
; (qwen3vl_merger, 27 blocks, projection_dim 2560 = qwen4exp.embedding_length). It costs 852 MiB
; of weights plus a 211 MiB compute buffer, and CUDA0 only has ~1.4 GiB free at 262144 + q8_0 KV,
; so the tower goes to the R9700: clip_encode OOMs on CUDA0 otherwise. Do not move it back
; instead of trimming ctx-size. Out: mmproj-device = none (CPU, slow but always fits).
[qwen3.8-flash-next-ud-q4_k_xl-00001-of-00004]
model = ${HF_CACHE}/models--unsloth--Qwen3.8-Flash-Next-GGUF/snapshots/766911a6b7369840a91dbcd95f9f997acaab6cd6/UD-Q4_K_XL/Qwen3.8-Flash-Next-UD-Q4_K_XL-00001-of-00004.gguf
mmproj = ${HF_CACHE}/models--unsloth--Qwen3.8-Flash-Next-GGUF/snapshots/766911a6b7369840a91dbcd95f9f997acaab6cd6/mmproj-F16.gguf
mmproj-device = ROCm0
dev = CUDA0
ctx-size = 262144
ctk = q8_0
ctv = q8_0
no-mmap = false
mlock = false
ot = blk\.(10|1[1-9]|2[0-9]|3[0-9]|4[0-7])\.ffn_(up|down|gate_up|gate)_(ch|)exps=CPU
spec-type = draft-mtp
spec-draft-model = ${HF_CACHE}/models--unsloth--Qwen3.8-Flash-Next-GGUF/snapshots/d96201194f103c906994f283f504209dc8d2a10c/MTP/mtp-Qwen3.8-Flash-Next-shared-Q8_0.gguf
spec-draft-device = CUDA0
spec-draft-n-max = 2

; unsloth qwen4exp, 157.5 GiB. Q6 experts are larger, so they go to RAM from blk.7 (blk.10 needs ~33 GiB VRAM).
; Load-tested alone and through the router (evicts the 113B): 27.3/32.6 GB VRAM, ~138 GiB in
; page cache, 9.6 t/s tg on a cold first request. Not measured warm.
[qwen3.8-flash-next-ud-q6_k_xl-00001-of-00006]
model = ${HF_CACHE}/models--unsloth--Qwen3.8-Flash-Next-GGUF/snapshots/766911a6b7369840a91dbcd95f9f997acaab6cd6/UD-Q6_K_XL/Qwen3.8-Flash-Next-UD-Q6_K_XL-00001-of-00006.gguf
dev = CUDA0
ctx-size = 262144
ctk = q8_0
ctv = q8_0
no-mmap = false
mlock = false
ot = blk\.([7-9]|1[0-9]|2[0-9]|3[0-9]|4[0-7])\.ffn_(up|down|gate_up|gate)_(ch|)exps=CPU
